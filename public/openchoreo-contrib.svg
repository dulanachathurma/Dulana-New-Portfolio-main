  <text x="645" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Validate manifests without mutating cluster state</text>
  <text x="645" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Simulates create/update against the Control Plane</text>
