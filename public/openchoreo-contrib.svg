  <text x="90" y="260" font-family="monospace" font-size="13" fill="#c9d1d9"> helm template my-app ./chart \</text>
  <text x="90" y="283" font-family="monospace" font-size="13" fill="#c9d1d9">   | </text><text x="125" y="283" font-family="monospace" font-size="13" fill="#79c0ff">occ apply</text><text x="215" y="283" font-family="monospace" font-size="13" fill="#ffa657"> -f -</text>
  <text x="70" y="316" font-family="monospace" font-size="13" fill="#8b949e">───────────────────────────────────</text>
  <text x="70" y="346" font-family="monospace" font-size="13" fill="#3fb950">$</text>
  <text x="90" y="346" font-family="monospace" font-size="13" fill="#c9d1d9"> cat manifest.yaml | </text><text x="312" y="346" font-family="monospace" font-size="13" fill="#79c0ff">occ apply</text><text x="402" y="346" font-family="monospace" font-size="13" fill="#ffa657"> -f -</text><text x="445" y="346" font-family="monospace" font-size="13" fill="#ffa657"> --dry-run</text>
  <text x="70" y="376" font-family="monospace" font-size="13" fill="#3fb950">✓</text>
  <text x="90" y="376" font-family="monospace" font-size="13" fill="#8b949e"> Deployment/nginx validated (dry-run: create)</text>
  <text x="70" y="399" font-family="monospace" font-size="13" fill="#3fb950">✓</text>
  <text x="90" y="399" font-family="monospace" font-size="13" fill="#8b949e"> Service/nginx-svc validated (dry-run: update)</text>
  <text x="70" y="422" font-family="monospace" font-size="13" fill="#3fb950">✓</text>
  <text x="90" y="422" font-family="monospace" font-size="13" fill="#8b949e"> ConfigMap/app-config validated (dry-run: create)</text>
  <text x="70" y="452" font-family="monospace" font-size="13" fill="#8b949e">───────────────────────────────────</text>
  <text x="70" y="482" font-family="monospace" font-size="13" fill="#3fb950">$</text>
  <text x="90" y="482" font-family="monospace" font-size="13" fill="#c9d1d9"> kustomize build ./overlays/prod \</text>
  <text x="90" y="505" font-family="monospace" font-size="13" fill="#c9d1d9">   | </text><text x="125" y="505" font-family="monospace" font-size="13" fill="#79c0ff">occ apply</text><text x="215" y="505" font-family="monospace" font-size="13" fill="#ffa657"> -f -</text>
  <text x="70" y="535" font-family="monospace" font-size="13" fill="#3fb950">✓</text>
  <text x="90" y="535" font-family="monospace" font-size="13" fill="#8b949e"> 3 resources applied successfully</text>
  <text x="70" y="558" font-family="monospace" font-size="13" fill="#00ADD8">⎈</text>
  <text x="90" y="558" font-family="monospace" font-size="13" fill="#c9d1d9"> Connected to control-plane</text>
