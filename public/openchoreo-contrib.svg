  <text x="645" y="298" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Handles empty input validation gracefully</text>
  <rect x="620" y="330" width="530" height="100" rx="12" fill="#161b22" stroke="#ffa657" stroke-width="1"/>
