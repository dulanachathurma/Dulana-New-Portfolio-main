  <text x="452" y="66" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#3fb950">PR #10487</text>
  <rect x="565" y="45" width="145" height="32" rx="16" fill="#FF7300" opacity="0.15"/>
  <text x="582" y="66" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FF7300">WSO2 Ecosystem</text>
  <!-- Title -->
  <text x="50" y="130" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f0f6fc">Improve project documentation, templates</text>
  <text x="50" y="165" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f0f6fc">and community guides</text>
  <text x="50" y="200" font-family="system-ui, sans-serif" font-size="15" fill="#8b949e">Developer guides · Resource references · Contributor onboarding · Templates</text>
  <!-- Documentation Preview - Left Column -->
  <rect x="50" y="230" width="530" height="350" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <!-- Doc header -->
  <rect x="50" y="230" width="530" height="36" rx="12" fill="#21262d"/>
  <rect x="50" y="254" width="530" height="12" fill="#21262d"/>
  <circle cx="72" cy="248" r="6" fill="#ff5f57"/><circle cx="92" cy="248" r="6" fill="#febc2e"/><circle cx="112" cy="248" r="6" fill="#28c840"/>
  <text x="200" y="253" font-family="monospace" font-size="12" fill="#8b949e">CONTRIBUTING.md</text>
  <!-- Markdown content -->
  <text x="70" y="290" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff"># Contributing to Ballerina</text>
  <text x="70" y="318" font-family="monospace" font-size="12" fill="#8b949e">Welcome! We're excited that you want to</text>
  <text x="70" y="336" font-family="monospace" font-size="12" fill="#8b949e">contribute to the Ballerina platform.</text>
  <text x="70" y="366" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">## Getting Started</text>
  <text x="70" y="394" font-family="monospace" font-size="12" fill="#3fb950">+ 1. Fork the repository</text>
  <text x="70" y="414" font-family="monospace" font-size="12" fill="#3fb950">+ 2. Clone your fork locally</text>
  <text x="70" y="434" font-family="monospace" font-size="12" fill="#3fb950">+ 3. Create a feature branch</text>
  <text x="70" y="454" font-family="monospace" font-size="12" fill="#3fb950">+ 4. Make your changes</text>
  <text x="70" y="474" font-family="monospace" font-size="12" fill="#3fb950">+ 5. Submit a pull request</text>
  <text x="70" y="504" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">## Code of Conduct</text>
  <text x="70" y="530" font-family="monospace" font-size="12" fill="#8b949e">Please read our [Code of Conduct]</text>
  <text x="70" y="548" font-family="monospace" font-size="12" fill="#8b949e">before contributing.</text>
  <!-- Right side: Feature cards -->
  <rect x="620" y="230" width="530" height="110" rx="12" fill="#161b22" stroke="#20B6B0" stroke-width="1"/>
  <text x="645" y="268" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#20B6B0">📖 Documentation Architecture</text>
  <text x="645" y="295" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Refined official developer guides, API references</text>
  <text x="645" y="315" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">and website documentation for the Ballerina platform</text>
  <rect x="620" y="355" width="530" height="100" rx="12" fill="#161b22" stroke="#ffa657" stroke-width="1"/>
  <text x="645" y="390" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffa657">👥 Community Onboarding</text>
  <text x="645" y="415" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Improved repository templates and contributor</text>
  <text x="645" y="435" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">guidelines to streamline open-source workflow</text>
  <rect x="620" y="470" width="255" height="90" rx="12" fill="#161b22" stroke="#FF7300" stroke-width="1"/>
  <text x="645" y="505" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FF7300">🏢 WSO2 Aligned</text>
  <text x="645" y="527" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Governance standards</text>
  <text x="645" y="545" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Quality compliance</text>
  <rect x="895" y="470" width="255" height="90" rx="12" fill="#161b22" stroke="#d2a8ff" stroke-width="1"/>
  <text x="920" y="505" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#d2a8ff">📝 Templates</text>
  <text x="920" y="527" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Issue templates</text>
  <text x="920" y="545" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">PR templates</text>
  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#161b22"/>
  <text x="50" y="615" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">ballerina-platform/ballerina-dev-website</text>
  <text x="360" y="615" font-family="system-ui, sans-serif" font-size="13" fill="#20B6B0">PR #10487</text>
  <text x="470" y="615" font-family="system-ui, sans-serif" font-size="13" fill="#e3b341">⏳ Under Review</text>
  <text x="980" y="615" font-family="system-ui, sans-serif" font-size="13" fill="#3fb950">+312  -87</text>
  <text x="1080" y="615" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">Docs · MD</text>
