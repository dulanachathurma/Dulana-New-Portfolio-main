  <text x="125" y="290" font-family="monospace" font-size="13" fill="#c9d1d9"> { useState } </text>
  <text x="275" y="290" font-family="monospace" font-size="13" fill="#ff7b72">from</text>
  <text x="320" y="290" font-family="monospace" font-size="13" fill="#a5d6ff"> 'react'</text>
  <text x="70" y="315" font-family="monospace" font-size="13" fill="#ff7b72">export const</text>
  <text x="190" y="315" font-family="monospace" font-size="13" fill="#d2a8ff"> AIAssistant</text>
  <text x="310" y="315" font-family="monospace" font-size="13" fill="#c9d1d9"> = () => {</text>
  <text x="90" y="345" font-family="monospace" font-size="13" fill="#ff7b72">  return</text>
  <text x="155" y="345" font-family="monospace" font-size="13" fill="#c9d1d9"> (</text>
  <text x="90" y="370" font-family="monospace" font-size="13" fill="#c9d1d9">    &lt;</text><text x="105" y="370" font-family="monospace" font-size="13" fill="#7ee787">Assistant.Root</text><text x="240" y="370" font-family="monospace" font-size="13" fill="#79c0ff"> mode=</text><text x="305" y="370" font-family="monospace" font-size="13" fill="#a5d6ff">"drawer"</text><text x="380" y="370" font-family="monospace" font-size="13" fill="#c9d1d9">&gt;</text>
  <text x="90" y="395" font-family="monospace" font-size="13" fill="#c9d1d9">      &lt;</text><text x="112" y="395" font-family="monospace" font-size="13" fill="#7ee787">Header</text><text x="165" y="395" font-family="monospace" font-size="13" fill="#c9d1d9"> /&gt;</text>
  <text x="90" y="420" font-family="monospace" font-size="13" fill="#c9d1d9">      &lt;</text><text x="112" y="420" font-family="monospace" font-size="13" fill="#7ee787">Messages</text><text x="185" y="420" font-family="monospace" font-size="13" fill="#c9d1d9"> /&gt;</text>
  <text x="90" y="445" font-family="monospace" font-size="13" fill="#c9d1d9">      &lt;</text><text x="112" y="445" font-family="monospace" font-size="13" fill="#7ee787">Thought</text><text x="175" y="445" font-family="monospace" font-size="13" fill="#79c0ff"> label=</text><text x="240" y="445" font-family="monospace" font-size="13" fill="#a5d6ff">"Thinking..."</text><text x="350" y="445" font-family="monospace" font-size="13" fill="#c9d1d9"> /&gt;</text>
  <text x="90" y="470" font-family="monospace" font-size="13" fill="#c9d1d9">      &lt;</text><text x="112" y="470" font-family="monospace" font-size="13" fill="#7ee787">Suggestions</text><text x="215" y="470" font-family="monospace" font-size="13" fill="#c9d1d9"> /&gt;</text>
  <text x="90" y="495" font-family="monospace" font-size="13" fill="#c9d1d9">      &lt;</text><text x="112" y="495" font-family="monospace" font-size="13" fill="#7ee787">PromptInput</text><text x="212" y="495" font-family="monospace" font-size="13" fill="#c9d1d9"> /&gt;</text>
  <text x="90" y="520" font-family="monospace" font-size="13" fill="#c9d1d9">    &lt;/</text><text x="118" y="520" font-family="monospace" font-size="13" fill="#7ee787">Assistant.Root</text><text x="253" y="520" font-family="monospace" font-size="13" fill="#c9d1d9">&gt;</text>
